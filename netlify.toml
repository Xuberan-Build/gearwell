# Publish the repo root, but keep internal files off the public site.
[build]
  publish = "."

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_migration/*"
  to = "/404.html"
  status = 404
  force = true

# Image filenames carry Webflow asset IDs, so they never change in place.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
